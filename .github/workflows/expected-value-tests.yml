name: Expected-value model tests

on:
  push:
    branches:
      - bootstrap/official-kit
    paths:
      - "lib/expected-value.mjs"
      - "tests/expected-value.test.mjs"
      - ".github/workflows/expected-value-tests.yml"
  pull_request:
    paths:
      - "lib/expected-value.mjs"
      - "tests/expected-value.test.mjs"
      - ".github/workflows/expected-value-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Run expected-value model tests
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/expected-value.test.mjs > test-output.txt 2>&1
          result=$?
          cat test-output.txt
          exit $result
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expected-value-test-output
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 7
