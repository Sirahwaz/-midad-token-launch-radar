name: Fetch official Token Radar kit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the published competition kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl --fail --location --retry 2 --retry-delay 2 \
            --dump-header artifact/response-headers.txt \
            "https://make.fun/c/token-radar-01/kit" \
            --output artifact/token-radar-01-kit.tar.gz
          expected="$(grep -i '^X-Kit-Tarball-Sha256:' artifact/response-headers.txt | tail -1 | awk '{print $2}' | tr -d '\r\n')"
          actual="$(sha256sum artifact/token-radar-01-kit.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          printf 'expected_sha256=%s\nactual_sha256=%s\n' "$expected" "$actual" > artifact/verification.txt
          tar -tzf artifact/token-radar-01-kit.tar.gz > artifact/archive-file-list.txt
      - name: Upload verified kit artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-radar-01-official-kit
          path: artifact/
          if-no-files-found: error
          retention-days: 7
