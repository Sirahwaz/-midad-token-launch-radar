name: Prepare official make.fun kit

on:
  push:
    branches:
      - bootstrap/official-kit
    paths:
      - .github/workflows/prepare-official-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Download and verify official competition kit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://make.fun/c/token-radar-01/kit \
            --output token-radar-01-kit.tar.gz
          mkdir -p kit
          tar -xzf token-radar-01-kit.tar.gz -C kit
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.resolve('kit/token-radar-01-kit');
          const manifestPath = path.join(root, 'kit.json');
          if (!fs.existsSync(manifestPath)) throw new Error('kit.json missing after extraction');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.competition !== 'token-radar-01') throw new Error('Unexpected competition id');
          if (!Array.isArray(manifest.files) || manifest.files.length === 0) throw new Error('Manifest file list missing');
          for (const item of manifest.files) {
            const file = path.resolve(root, item.path);
            if (!file.startsWith(root + path.sep)) throw new Error('Unsafe manifest path: ' + item.path);
            if (!fs.existsSync(file)) throw new Error('Missing kit file: ' + item.path);
            const bytes = fs.readFileSync(file);
            if (bytes.length !== item.size) throw new Error('Size mismatch: ' + item.path);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== item.sha256) throw new Error('SHA-256 mismatch: ' + item.path);
          }
          for (const required of [
            'RULES.txt',
            'input/snapshot.json',
            'starter/main.ts',
            'starter/vendor/makefun-board.ts',
            'starter/dashboard/index.html'
          ]) {
            if (!manifest.files.some(item => item.path === required)) {
              throw new Error('Required path absent from manifest: ' + required);
            }
          }
          console.log(JSON.stringify({
            competition: manifest.competition,
            phase: manifest.phase,
            harness_version: manifest.harness_version,
            manifest_files_verified: manifest.files.length,
            bundle_sha256_manifest_value: manifest.bundle_sha256,
            archive_sha256: crypto.createHash('sha256').update(fs.readFileSync('token-radar-01-kit.tar.gz')).digest('hex')
          }, null, 2));
          NODE
          node --version
          printf '\nArchive listing (first 80 entries):\n'
          tar -tzf token-radar-01-kit.tar.gz | sed -n '1,80p'

      - name: Upload verified kit for inspection
        uses: actions/upload-artifact@v4
        with:
          name: makefun-token-radar-01-official-kit
          path: |
            token-radar-01-kit.tar.gz
            kit/token-radar-01-kit/kit.json
            kit/token-radar-01-kit/RULES.txt
            kit/token-radar-01-kit/input/README.md
            kit/token-radar-01-kit/input/snapshot.json
            kit/token-radar-01-kit/starter/
          if-no-files-found: error
          retention-days: 7
