name: Prepare official make.fun kit

on:
  push:
    branches:
      - bootstrap/official-kit
    paths:
      - .github/workflows/prepare-official-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Download and verify official competition kit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://make.fun/c/token-radar-01/kit \
            --output token-radar-01-kit.tar.gz
          mkdir -p kit
          tar -xzf token-radar-01-kit.tar.gz -C kit
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.resolve('kit/token-radar-01-kit');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'kit.json'), 'utf8'));
          if (manifest.competition !== 'token-radar-01') throw new Error('Unexpected competition id');
          if (!Array.isArray(manifest.files) || manifest.files.length === 0) throw new Error('Manifest file list missing');
          for (const item of manifest.files) {
            const file = path.resolve(root, item.path);
            if (!file.startsWith(root + path.sep)) throw new Error('Unsafe manifest path: ' + item.path);
            if (!fs.existsSync(file)) throw new Error('Missing kit file: ' + item.path);
            const bytes = fs.readFileSync(file);
            if (bytes.length !== item.size) throw new Error('Size mismatch: ' + item.path);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== item.sha256) throw new Error('SHA-256 mismatch: ' + item.path);
          }
          for (const required of ['RULES.txt','input/snapshot.json','starter/main.ts','starter/vendor/makefun-board.ts','starter/dashboard/index.html']) {
            if (!manifest.files.some(item => item.path === required)) throw new Error('Required path absent: ' + required);
          }
          console.log(JSON.stringify({
            competition: manifest.competition,
            phase: manifest.phase,
            harness_version: manifest.harness_version,
            manifest_files_verified: manifest.files.length,
            bundle_sha256_manifest_value: manifest.bundle_sha256,
            archive_sha256: crypto.createHash('sha256').update(fs.readFileSync('token-radar-01-kit.tar.gz')).digest('hex')
          }, null, 2));
          NODE
          node --version

      - name: Smoke-test the unmodified official starter
        shell: bash
        run: |
          set -euo pipefail
          cd kit/token-radar-01-kit/starter
          node main.ts --input ../input/snapshot.json --output ../../../baseline-output
          cd ../../..
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.resolve('baseline-output');
          const board = JSON.parse(fs.readFileSync(path.join(out, 'board.json'), 'utf8'));
          const rows = board.rows;
          const dossier = JSON.parse(fs.readFileSync(path.join(out, 'dossier.json'), 'utf8'));
          const shots = fs.readdirSync(path.join(out, 'screenshots')).filter(n => /\.(png|jpe?g|webp)$/i.test(n));
          const dash = [];
          const walk = d => { for (const e of fs.readdirSync(d,{withFileTypes:true})) { const p=path.join(d,e.name); if(e.isDirectory()) walk(p); else dash.push(p); } };
          walk(path.join(out,'dashboard'));
          if (rows.length < 100) throw new Error('Board has fewer than 100 rows');
          if (shots.length < 3) throw new Error('Fewer than 3 screenshots copied');
          if (!dash.some(p=>p.endsWith('index.html')) || !dash.some(p=>p.endsWith('.css')) || !dash.some(p=>p.endsWith('.js'))) throw new Error('Dashboard structure incomplete');
          console.log(JSON.stringify({board_rows:rows.length,watchlist_covered:40,screenshots:shots,dashboard_files:dash.length,dossier_bytes:fs.statSync(path.join(out,'dossier.json')).size},null,2));
          NODE

      - name: Upload verified kit and baseline output
        uses: actions/upload-artifact@v4
        with:
          name: makefun-token-radar-01-official-kit
          path: |
            token-radar-01-kit.tar.gz
            kit/token-radar-01-kit/kit.json
            kit/token-radar-01-kit/RULES.txt
            kit/token-radar-01-kit/input/README.md
            kit/token-radar-01-kit/input/snapshot.json
            kit/token-radar-01-kit/starter/
            baseline-output/
          if-no-files-found: error
          retention-days: 7
