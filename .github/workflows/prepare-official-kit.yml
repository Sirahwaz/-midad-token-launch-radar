name: Prepare official make.fun kit

on:
  push:
    branches:
      - bootstrap/official-kit
    paths:
      - .github/workflows/prepare-official-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Download official competition kit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://make.fun/c/token-radar-01/kit \
            --output token-radar-01-kit.tar.gz
          echo "ea1c9dccab78e6846655e81b921a79465c7267677ea2e0908624ddbc8a012d43  token-radar-01-kit.tar.gz" | sha256sum --check
          mkdir -p kit
          tar -xzf token-radar-01-kit.tar.gz -C kit
          test -f kit/token-radar-01-kit/kit.json
          test -f kit/token-radar-01-kit/RULES.txt
          test -f kit/token-radar-01-kit/input/snapshot.json
          test -f kit/token-radar-01-kit/starter/main.ts
          test -f kit/token-radar-01-kit/starter/vendor/makefun-board.ts
          node --version
          printf '\nVerified archive contents:\n'
          tar -tzf token-radar-01-kit.tar.gz | sed -n '1,80p'

      - name: Upload verified kit for inspection
        uses: actions/upload-artifact@v4
        with:
          name: makefun-token-radar-01-official-kit
          path: |
            token-radar-01-kit.tar.gz
            kit/token-radar-01-kit/kit.json
            kit/token-radar-01-kit/RULES.txt
            kit/token-radar-01-kit/input/README.md
            kit/token-radar-01-kit/input/snapshot.json
            kit/token-radar-01-kit/starter/
          if-no-files-found: error
          retention-days: 7
