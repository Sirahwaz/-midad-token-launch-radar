name: Retrieve official Make.fun kit
on:
  push:
    branches:
      - ops/official-kit-retrieval
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official kit tarball
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output kit.tar.gz \
            https://make.fun/c/token-radar-01/kit
          file kit.tar.gz
          tar -tzf kit.tar.gz > kit-files.txt
          mkdir -p kit-extracted
          tar -xzf kit.tar.gz -C kit-extracted
      - name: Verify every manifest file by SHA-256 and size
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.resolve('kit-extracted');
          const walk = (dir) => fs.readdirSync(dir, {withFileTypes:true}).flatMap(d => {
            const p = path.join(dir,d.name);
            return d.isDirectory() ? walk(p) : [p];
          });
          const all = walk(root);
          const manifestFile = all.find(p => path.basename(p) === 'kit.json');
          if (!manifestFile) {
            fs.writeFileSync('verification.txt', 'FAIL: kit.json not found in extracted archive\\n');
            process.exit(2);
          }
          const manifest = JSON.parse(fs.readFileSync(manifestFile,'utf8'));
          const base = path.dirname(manifestFile);
          const lines = [
            'bundle_sha256=' + (manifest.bundle_sha256 || 'missing'),
            'harness_version=' + (manifest.harness_version || 'missing'),
            'scorer_version=' + (manifest.scorer_version || 'missing'),
            'manifest_files=' + (manifest.files || []).length
          ];
          let failures = 0;
          for (const f of (manifest.files || [])) {
            const target = path.join(base, f.path);
            if (!fs.existsSync(target)) {
              lines.push('MISSING ' + f.path);
              failures++;
              continue;
            }
            const bytes = fs.readFileSync(target);
            const sha = crypto.createHash('sha256').update(bytes).digest('hex');
            const ok = bytes.length === f.size && sha === f.sha256;
            lines.push((ok ? 'PASS ' : 'FAIL ') + f.path + ' bytes=' + bytes.length + ' sha256=' + sha);
            if (!ok) failures++;
          }
          lines.push('verification=' + (failures === 0 ? 'PASS' : 'FAIL') + ' failures=' + failures);
          fs.writeFileSync('verification.txt', lines.join('\\n') + '\\n');
          console.log(lines.join('\\n'));
          if (failures) process.exit(1);
          NODE
      - name: Preserve kit and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makefun-token-radar-official-kit
          path: |
            kit.tar.gz
            kit-files.txt
            kit-extracted/**
            verification.txt
          if-no-files-found: warn
          retention-days: 30
